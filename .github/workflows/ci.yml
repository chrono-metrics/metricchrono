name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --no-default-features
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps
      - run: cargo build -p metricchrono-ffi --release
      - run: cmp -s include/metricchrono.h crates/metricchrono-ffi/include/metricchrono.h
      - run: cargo bench --workspace --no-run
      - run: cargo run -p metricchrono-core --example basic_tick
      - run: cargo run -p metricchrono-core --example multiscale_ladder
      - run: cargo run -p metricchrono-core --example smooth_surrogate
      - run: cargo run -p metricchrono-core --example event_log
      - run: cargo run -p metricchrono-core --example consensus_field
      - run: npm test
        working-directory: bindings/js
      - run: python -m pip install build pytest
      - run: python -m pytest bindings/python/tests
        env:
          PYTHONPATH: bindings/python
          METRICCHRONO_FFI_LIB: target/release/libmetricchrono_ffi.so
      - run: python bindings/python/tests/golden.py
        env:
          PYTHONPATH: bindings/python
          METRICCHRONO_FFI_LIB: target/release/libmetricchrono_ffi.so
      - run: cargo package -p metricchrono-core
      - run: cargo package -p metricchrono-log --allow-dirty --no-verify --list
      - run: cargo package -p metricchrono-consensus --allow-dirty --no-verify --list
      - run: cargo package -p metricchrono-ffi --allow-dirty --no-verify --list
      - run: npm_config_cache=/tmp/npm-cache npm pack --dry-run
        working-directory: bindings/js
      - run: python -m build bindings/python --sdist --outdir /tmp/metricchrono-sdist
      - run: python -m pip wheel /tmp/metricchrono-sdist/metricchrono-0.1.0.tar.gz --no-deps -w /tmp/metricchrono-wheel
      - run: python -m pip install --force-reinstall /tmp/metricchrono-wheel/metricchrono-0.1.0-*.whl
      - run: python -c "import metricchrono as mc; print(mc.tick_distance(1.2, mc.Tier(0.5, 1.0, 0.5, 1.0)))"
