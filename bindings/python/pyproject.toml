[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metricchrono"
version = "0.2.0"
description = "Python bindings for the MetricChrono Rust C ABI"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "MetricChrono contributors" }]
keywords = ["metricchrono", "time", "metrics", "ffi", "signal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/chrono-metrics/metricchrono"
Repository = "https://github.com/chrono-metrics/metricchrono"
Issues = "https://github.com/chrono-metrics/metricchrono/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["metricchrono"]

[tool.setuptools.package-data]
metricchrono = ["*.dylib", "*.so", "*.dll", "py.typed"]
