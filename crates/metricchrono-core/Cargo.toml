[package]
name = "metricchrono-core"
description = "Open-source MetricChrono kernel, ladders, basic event log, and minimal consensus"
readme = "README.md"
keywords = ["time", "metrics", "event", "ffi", "signal"]
categories = ["algorithms", "science", "simulation"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "metricchrono_core"

[features]
metrics-extra = []

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[[bench]]
name = "ladder_throughput"
harness = false

[[bench]]
name = "coverage_throughput"
harness = false

[[bench]]
name = "publish_suite"
harness = false

[[bench]]
name = "clock_only_comparison"
harness = false
